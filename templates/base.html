<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="B.Tech Career Path Finder - discover career opportunities after engineering graduation."
    >

    <title>{% block title %}B.Tech Career Path Finder{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="page-glow glow-one"></div>
    <div class="page-glow glow-two"></div>

    <nav class="navbar">

        <a class="brand" href="{{ url_for('home') }}">

            <span class="brand-mark">CP</span>

            <span>
                <strong>CareerPath</strong>
                <small>B.Tech Navigator</small>
            </span>

        </a>

        <a class="nav-home" href="{{ url_for('home') }}">
            Home
        </a>

    </nav>

    <main class="page">

        {% block content %}{% endblock %}

    </main>

    <footer class="footer">

        <span>© 2026 CareerPath</span>

        <span>Built with Python + Flask</span>

    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
